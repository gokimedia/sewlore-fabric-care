# Intended repository path: .github/workflows/publish-pypi.yml
name: Build and publish Python distribution

on:
  workflow_dispatch:
    inputs:
      approve_publish:
        description: "Publish the reviewed version to PyPI"
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --index-url https://pypi.org/simple build==1.6.1 setuptools==84.0.0 wheel==0.48.0
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Install and test the built wheel
        run: |
          python -m pip install --no-index --no-deps dist/*.whl
          python -B -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.approve_publish == true
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Publish using the configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
